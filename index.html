<!DOCTYPE html>
<html lang="ja" class="h-full w-full overflow-hidden">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>デジタル時計</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome アイコン -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (丸ゴシック & 数字用太字フォント) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700&family=M+PLUS+Rounded+1c:wght@900&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: 'Fredoka', 'M PLUS Rounded 1c', sans-serif;
            transition: background-color 0.4s ease, color 0.4s ease;
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 毎秒点滅するコロン */
        @keyframes pulse-blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.15; }
        }
        .colon-blink {
            animation: pulse-blink 1s infinite;
        }

        /* 超大型デジタル数字のサイズ最適化 */
        .giant-clock-text {
            font-size: min(22vw, 38vh);
            line-height: 1;
            font-weight: 900;
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.02em;
        }

        /* AM/PM小文字表示 */
        .ampm-text {
            font-size: min(6vw, 10vh);
            line-height: 1;
            font-weight: 900;
            margin-right: 1vw;
        }

        /* 4つの高コントラストテーマ */
        body.theme-dark {
            background-color: #0f172a;
            color: #f8fafc;
        }
        body.theme-dark .accent-color { color: #38bdf8; }

        body.theme-light {
            background-color: #ffffff;
            color: #0f172a;
        }
        body.theme-light .accent-color { color: #e11d48; }

        body.theme-vivid {
            background-color: #4c1d95;
            color: #fbbf24;
        }
        body.theme-vivid .accent-color { color: #f43f5e; }

        body.theme-green {
            background-color: #052e16;
            color: #4ade80;
        }
        body.theme-green .accent-color { color: #facc15; }

        /* ホバーで浮き出る控えめな操作コントロール */
        .control-bar {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        body:hover .control-bar,
        .control-bar:hover,
        .control-bar:focus-within {
            opacity: 1;
            transform: translateY(0);
        }

        .btn-bounce {
            transition: transform 0.1s ease;
        }
        .btn-bounce:active {
            transform: scale(0.92);
        }
    </style>
</head>
<body class="theme-dark w-screen h-screen">

    <!-- 画面中央配置：余計な要素・カード・タイトルを完全に除去 -->
    <main class="w-full h-full flex items-center justify-center p-2 text-center select-none">
        <div class="giant-clock-text flex items-center justify-center flex-nowrap whitespace-nowrap">
            <!-- AM / PM 表示 -->
            <span id="clock-ampm" class="ampm-text accent-color hidden">AM</span>
            <!-- 時 -->
            <span id="clock-hours">00</span>
            <!-- 点滅コロン -->
            <span class="colon-blink accent-color px-[0.1em]">:</span>
            <!-- 分 -->
            <span id="clock-minutes">00</span>
            <!-- 点滅コロン -->
            <span class="colon-blink accent-color px-[0.1em]">:</span>
            <!-- 秒 -->
            <span id="clock-seconds">00</span>
        </div>
    </main>

    <!-- 画面最下部にマウスを乗せた時だけ表示される操作バー -->
    <div class="control-bar fixed bottom-6 left-1/2 -translate-x-1/2 bg-black/60 backdrop-blur-md border border-white/20 text-white px-6 py-3 rounded-full flex items-center gap-4 shadow-2xl z-50">
        <!-- 12H/24H 切り替え -->
        <button onclick="toggleFormat()" class="btn-bounce px-3 py-1.5 rounded-lg bg-white/10 hover:bg-white/20 text-xs sm:text-sm font-bold flex items-center gap-2">
            <i class="fa-solid fa-clock accent-color"></i>
            <span id="format-label">12時間表示</span>
        </button>

        <div class="w-[1px] h-5 bg-white/20"></div>

        <!-- テーマ切り替えボタン群 -->
        <div class="flex items-center gap-2">
            <button onclick="setTheme('theme-dark')" class="btn-bounce w-7 h-7 rounded-full bg-slate-900 border-2 border-white/80" title="ダーク"></button>
            <button onclick="setTheme('theme-light')" class="btn-bounce w-7 h-7 rounded-full bg-white border-2 border-slate-900" title="ライト"></button>
            <button onclick="setTheme('theme-vivid')" class="btn-bounce w-7 h-7 rounded-full bg-purple-900 border-2 border-yellow-400" title="ビビッド"></button>
            <button onclick="setTheme('theme-green')" class="btn-bounce w-7 h-7 rounded-full bg-emerald-950 border-2 border-green-400" title="グリーン"></button>
        </div>

        <div class="w-[1px] h-5 bg-white/20"></div>

        <!-- 全画面切り替え -->
        <button onclick="toggleFullscreen()" class="btn-bounce px-3 py-1.5 rounded-lg bg-white/10 hover:bg-white/20 text-xs sm:text-sm font-bold flex items-center gap-2" title="ぜんめん表示">
            <i class="fa-solid fa-expand accent-color"></i>
            <span>全画面</span>
        </button>
    </div>

    <script>
        let is24HourFormat = false;

        /* 時刻更新処理 */
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();

            const ampmEl = document.getElementById('clock-ampm');

            if (!is24HourFormat) {
                const ampmText = hours >= 12 ? 'PM' : 'AM';
                ampmEl.textContent = ampmText;
                ampmEl.classList.remove('hidden');

                hours = hours % 12;
                if (hours === 0) hours = 12;
            } else {
                ampmEl.classList.add('hidden');
            }

            document.getElementById('clock-hours').textContent = String(hours).padStart(2, '0');
            document.getElementById('clock-minutes').textContent = String(minutes).padStart(2, '0');
            document.getElementById('clock-seconds').textContent = String(seconds).padStart(2, '0');
        }

        /* 12H / 24H 切り替え */
        function toggleFormat() {
            is24HourFormat = !is24HourFormat;
            document.getElementById('format-label').textContent = is24HourFormat ? '24時間表示' : '12時間表示';
            updateClock();
        }

        /* テーマ変更 */
        function setTheme(themeName) {
            document.body.className = `${themeName} w-screen h-screen`;
        }

        /* フルスクリーン切替 */
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        /* タイマー起動 */
        window.addEventListener('DOMContentLoaded', () => {
            updateClock();
            setInterval(updateClock, 1000);
        });
    </script>
</body>
</html>
